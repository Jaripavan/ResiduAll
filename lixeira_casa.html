<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="casa_style.css">
    
    <title>Adicionar um Endereço</title>
</head>
<body>
    <div class="container">
        <h1>Adicione um endereço</h1>
        <form>
            <label for="nome-completo">Nome completo</label>
            <input type="text" id="nome-completo" name="nome-completo" required>

            <label for="cep">CEP</label>
            <input type="text" id="cep" name="cep" required>
            <button type="button">Não sei o meu CEP</button>

            <label for="estado">Estado</label>
            <input type="text" id="estado" name="estado" required>

            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" required>

            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" name="bairro" required>

            <label for="rua">Rua/Avenida</label>
            <input type="text" id="rua" name="rua" required>

            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero">
            <input type="checkbox" id="sem-numero" name="sem-numero">
            <label for="sem-numero">Sem número</label>

            <label for="complemento">Complemento (opcional)</label>
            <input type="text" id="complemento" name="complemento">

            <label>Este é o seu trabalho ou sua casa?</label>
            <input type="radio" id="trabalho" name="tipo" value="trabalho">
            <label for="trabalho">Trabalho</label>
            <input type="radio" id="residencial" name="tipo" value="residencial">
            <label for="residencial">Residencial</label>

            <label for="telefone">Telefone de contato</label>
            <input type="text" id="telefone" name="telefone" required>

            <label for="info-adicional">Informações adicionais deste endereço (opcional)</label>
            <textarea id="info-adicional" name="info-adicional" rows="4" maxlength="128"></textarea>

            <button type="submit">Enviar</button>
        </form>

        <div class="resumo">
            <h2>Resumo da compra</h2>
            <p>Produto: R$ 499,99</p>
            <p>Frete: R$ 20 </p>
            <p>Você pagará: R$ 519,99 </p>
        </div>
    </div>
</body>
</html>
